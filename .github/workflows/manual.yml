name: Run Spring Boot Tests on macOS

on:
  push:
    branches:
      - master  # Trigger on push to the main branch, change if needed
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master  # Trigger on pull request to the main branch
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  branch-name-check:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
      - name: Validate branch name
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          if [[ ! "$BRANCH_NAME" =~ ^release/PR-([1-9][0-9]*)($|-) ]]; then
            echo "Branch name must start with release/PR-{number}."
            exit 1
          fi

  commit-message-check:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate commit message PR number matches branch
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ ! "$BRANCH_NAME" =~ ^release/PR-([1-9][0-9]*)($|-) ]]; then
            echo "Branch name must start with release/PR-{number}."
            exit 1
          fi

          branch_pr="${BASH_REMATCH[1]}"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            commit_message="$(git log -1 --pretty=%s "$HEAD_SHA")"
          else
            commit_message="$(git log -1 --pretty=%s)"
          fi

          if [[ ! "$commit_message" =~ ^PR-([1-9][0-9]*)($|[[:space:]:-]) ]]; then
            echo "Commit message must start with PR-{number}."
            exit 1
          fi

          commit_pr="${BASH_REMATCH[1]}"

          if [[ "$commit_pr" != "$branch_pr" ]]; then
            echo "Commit message PR number must match the branch PR number."
            exit 1
          fi

  test:
    needs:
      - branch-name-check
      - commit-message-check
    runs-on: macos-latest  # macOS runner

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Step 2: Set up JDK 25
      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: 'corretto'

      - name: Cache Maven dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run tests with Maven
        run: mvn clean install
